name: wangmai

x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    image: wangmai-frontend:${WANGMAI_IMAGE_TAG:?Set the reviewed release image tag}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *bounded-logs
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_INTERNAL_ORIGIN: http://backend:4000
    networks: [app]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  backend:
    image: wangmai-backend:${WANGMAI_IMAGE_TAG:?Set the reviewed release image tag}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *bounded-logs
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with host postgres for production}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set the public HTTPS origin}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a random auth secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set Google OAuth client ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set Google OAuth client secret}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app, database]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    restart: unless-stopped
    logging: *bounded-logs
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    logging: *bounded-logs
    stop_grace_period: 30s
    environment:
      WANGMAI_DOMAIN: ${WANGMAI_DOMAIN:?Set the real public DNS hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks: [edge, app]
    healthcheck:
      # Admin API stays on container loopback; this never requests a certificate.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  edge:
  app:
    # Backend needs outbound HTTPS for Google OAuth. No application ports are published.
  database:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
