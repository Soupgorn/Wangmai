name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: docker compose --env-file .env.example -f compose.yaml config --quiet
        env:
          WANGMAI_IMAGE_TAG: ci-config-validation
      - run: docker compose --env-file .env.example -f compose.dev.yaml config --quiet
