# Explicit one-shot tools only. Never add this override to the long-running stack.
x-database-tool: &database-tool
  image: wangmai-backend:${WANGMAI_IMAGE_TAG:?Set the reviewed release image tag}
  profiles: [database-ops]
  restart: "no"
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  networks: [database]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  depends_on:
    postgres: {condition: service_healthy}
services:
  bootstrap:
    <<: *database-tool
    command: [node, backend/dist/db/bootstrap.js]
    environment:
      PGHOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:?Set initialization administrator}
      POSTGRES_DB: ${POSTGRES_DB:?Set database name}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:?Set runtime role}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:?Set migration role}
      POSTGRES_ADMIN_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_RUNTIME_PASSWORD_FILE: /run/secrets/postgres_runtime_password
      POSTGRES_MIGRATION_PASSWORD_FILE: /run/secrets/postgres_migration_password
    secrets: [postgres_admin_password, postgres_runtime_password, postgres_migration_password]
  migrator:
    <<: *database-tool
    command: [node, backend/dist/db/migrate.js]
    environment:
      NODE_ENV: production
      DATABASE_RUNTIME_ROLE: ${POSTGRES_RUNTIME_USER:?Set runtime role}
      DATABASE_MIGRATION_ROLE: ${POSTGRES_MIGRATION_USER:?Set migration role}
      MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
    secrets: [migration_database_url]
secrets:
  postgres_admin_password:
    file: ${POSTGRES_ADMIN_PASSWORD_FILE:?Set protected admin password file}
  postgres_runtime_password:
    file: ${POSTGRES_RUNTIME_PASSWORD_FILE:?Set protected runtime password file}
  postgres_migration_password:
    file: ${POSTGRES_MIGRATION_PASSWORD_FILE:?Set protected migration password file}
  migration_database_url:
    file: ${MIGRATION_DATABASE_URL_FILE:?Set protected migration connection file}
